<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"

/>
</head>
<body>
    <main>
        <div class="grid-container">
            <div class="navbar">
                <div class="nav-links">
                    <div class="logo">

                    </div>
                    <div class="links">

                    </div>
                </div>

            </div>
            <div class="main-head">

                          <text>

                 <div class="play-icon">

</div>

</div>

            <div class="btm-rt">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRdC0r8BQrUQCW2cZPEd8CkuWsTT6HOmkHCsqAyJOVM5EFatRvJ" alt="">

            </div>
            <div class="top-left">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRxRELfuDIMRw7SJrzdvWE9fkmi0rwbtQyD-63Vx7yTGnL7S5KY" alt="">

            </div>
            <div class="btm-left">
                <img src="https://image-cdn.hypb.st/https://hk.hypebeast.com/files/2016/09/golf-wang-fw16-collection-51.jpg?q=90&w=800&cbr=1&fit=max" alt="">

            </div>

                <img src="https://i.pinimg.com/236x/d8/24/96/d82496604d110bb68edb6ca238fe9c88.jpg" alt="">
